name: Core
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --offline -- -D warnings
      - run: cargo test --workspace --offline
      - run: cargo run -p vocal-time --example tempo_map --offline
      - run: cargo run -p vocal-project --example project_roundtrip --offline
      - run: cargo run -p vocal-project --example import_wav --offline
      - run: cargo run -p vocal-analysis-runtime --example analyze_waveform --offline
      - run: cargo run -p vocal-app --example import_session --offline --locked
