name: Core
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: cargo fetch --locked
      - name: Shared core validation
        shell: pwsh
        run: ./tools/verify.ps1 -Scope Core -Environment System
