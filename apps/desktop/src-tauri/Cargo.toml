[package]
name = "vals-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# Keep platform WebView build dependencies out of portable core checks.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
vocal-app = { path = "../../../crates/vocal-app" }
vocal-domain = { path = "../../../crates/vocal-domain" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
